name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 4 * * *" # every day at 4:00 UTC

  workflow_dispatch:
    inputs:
      ai_model:
        description: "Enter the AI model slug for the pentest in liteLLM format (e.g. openrouter/openai/gpt-chat-latest):"
        required: true
        type: string

      scan_mode:
        description: |
          Strix Scan Mode depth (Choose based on your use case):
          - quick: Fast checks for obvious vulnerabilities. (Best for CI/CD, PRs, smoke tests. Duration: Minutes).
          - standard: Balanced routine review. Uses source-aware mapping and static triage to prioritize dynamic exploit validation paths. (Duration: 30m - 1h).
          - deep: Thorough pentest. DEFAULT mode. Runs broad triage (semgrep, AST search, secrets, supply-chain checks) and systematically validates candidates dynamically. Explores edge cases, chained vulnerabilities, and complex paths. (Duration: 1-4h).
        required: true
        type: choice
        options:
          - standard
          - quick
          - deep
        default: "standard"

      scope_mode:
        description: "Scope Mode (full: scan everything, diff: only changed files)"
        required: true
        type: choice
        options:
          - full
          - diff
        default: "full"

      llm_timeout:
        description: "LLM request timeout in seconds (increase for huge contexts)"
        required: true
        type: string
        default: "600"

      max_retries:
        description: "Maximum number of retries for API failures"
        required: true
        type: string
        default: "7"

permissions:
  contents: read

# Scheduled runs share one group so they queue instead of overlapping.
# Manual runs fold their inputs into the group so that two dispatches with
# different parameters do not cancel/replace each other. The "-caller"
# suffix keeps this group distinct from any group a called reusable
# workflow (e.g. the OSV scan below) builds from "${{ github.workflow }}".
concurrency:
  group: >-
    ${{ github.workflow }}-caller-${{ github.event_name }}-${{ github.event.inputs.ai_model || 'no-model' }}-${{ github.event.inputs.scan_mode || 'no-scan-mode' }}-${{ github.event.inputs.scope_mode || 'no-scope' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  security-scan-semgrep:
    name: 🔐 Security Scan Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: security-scans

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Setup Socket Firewall
        uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Install Semgrep via Socket Firewall
        run: sfw pip install semgrep

      - name: Setup Semgrep Pro Engine via Socket Firewall
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: sfw semgrep install-semgrep-pro

      # Exclude mutable action tag rule because Semgrep does not support the modern
      # actions.lockfile mechanism yet.
      - name: Run Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --pro \
            --config auto \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/github-actions" \
            --config "p/supply-chain" \
            --exclude-rule "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag" \
            --sarif-output semgrep.sarif \
            --error

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.0
        if: ${{ always() }}
        with:
          sarif_file: semgrep.sarif

  security-scan-strix:
    name: 🔐 Security Scan Strix
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    if: ${{ github.event_name == 'workflow_dispatch' }}

    environment: ai

    permissions:
      contents: read
      actions: read

    env:
      STRIX_LLM: ${{ github.event.inputs.ai_model }}
      LLM_TIMEOUT: ${{ github.event.inputs.llm_timeout }}
      STRIX_LLM_MAX_RETRIES: ${{ github.event.inputs.max_retries }}
      STRIX_SCAN_MODE: ${{ github.event.inputs.scan_mode }}
      STRIX_SCOPE_MODE: ${{ github.event.inputs.scope_mode }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Strix
        run: | # jactionlint ignore=unverified-download
          curl -sSL -o install_strix.sh https://strix.ai/install
          bash install_strix.sh

      - name: Run Code Analysis via ${{ env.STRIX_LLM }}
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_TOKEN_FREE_1 }}
        run: |
          strix -n \
            -t ./ \
            --scan-mode "$STRIX_SCAN_MODE" \
            --scope-mode "$STRIX_SCOPE_MODE" \
            --instruction-file ".github/strix/rules.txt"

  security-scan-supply-chain-guard:
    name: 🔐 Security Scan supply-chain-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: homeofe/supply-chain-guard@v6.5.9
        with:
          fail-on: low
          comment-on-pr: true
          refresh-catalog: true
          exclude-rules: POLICY_SUPPRESSED_SEVERE

  security-scan-jactionlint:
    name: 🔐 Security Scan jactionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint (pedantic + online + strict exit)
        uses: jdx/jactionlint@v2.2.0
        with:
          profile: pedantic
          online: strict
          strict-exit: true
          advanced-security: true

  security-scan-gh-actions-lockfile:
    name: 🔐 Security Scan GitHub Actions Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock extension
        env:
          RETRY_COUNT: 3
          RETRY_DELAY: 30
        run: |
          for i in $(seq 1 "$RETRY_COUNT"); do
            echo "Attempt $i of $RETRY_COUNT to install github/gh-actions-lock..."
            if gh extension install github/gh-actions-lock; then
              echo "Extension installed successfully!"
              exit 0
            fi
          
            if [ "$i" -lt "$RETRY_COUNT" ]; then
              echo "Installation failed. Waiting $RETRY_DELAY seconds before next attempt..."
              sleep "$RETRY_DELAY"
            fi
          done
          
          echo "Error: Failed to install extension after $RETRY_COUNT attempts."
          exit 1

      - name: Verify GitHub Actions lockfile
        run: |
          gh actions-lock --verify
